<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1350" width="1700" height="1350" style="background:#0f172a; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow-seq" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="seq-dash-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="30" width="1620" height="80" rx="10" fill="#1e293b" filter="url(#shadow-seq)" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="70" fill="#f8fafc" font-size="24" font-weight="bold">SISTEMA POS PAPELERÍA A B C — DIAGRAMAS DE SECUENCIA CLAVE</text>
  <text x="70" y="94" fill="#94a3b8" font-size="13">Fase 2: Flujos Temporales de Datos, Transacciones Locales y Kardex | Papelería A B C</text>

  <!-- ================= SECTION 1: VENTA DIRECTA & KARDEX ================= -->
  <g transform="translate(40, 140)">
    <rect width="1620" height="560" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="15" width="480" height="32" rx="6" fill="#0369a1"/>
    <text x="35" y="37" fill="#ffffff" font-size="14" font-weight="bold">Secuencia 1: Venta POS Papelería A B C con Lector y Descuento Kardex</text>

    <!-- Lifelines -->
    <!-- 1. Cajero -->
    <rect x="100" y="70" width="140" height="36" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="170" y="93" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">:Cajero ABC</text>
    <line x1="170" y1="106" x2="170" y2="520" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- 2. UI POS -->
    <rect x="420" y="70" width="150" height="36" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="495" y="93" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">:InterfazPOS (HTML)</text>
    <line x1="495" y1="106" x2="495" y2="520" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- 3. Memoria Local / State -->
    <rect x="760" y="70" width="160" height="36" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="840" y="93" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">:CatalogoMemoriaJS</text>
    <line x1="840" y1="106" x2="840" y2="520" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- 4. Transaccionador BD -->
    <rect x="1100" y="70" width="180" height="36" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="1190" y="93" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">:GestorPersistenciaBD</text>
    <line x1="1190" y1="106" x2="1190" y2="520" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- 5. Impresora Ticket -->
    <rect x="1410" y="70" width="150" height="36" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="1485" y="93" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">:ImpresoraTermica</text>
    <line x1="1485" y1="106" x2="1485" y2="520" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Messages -->
    <line x1="170" y1="140" x2="495" y2="140" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="320" y="132" fill="#e2e8f0" font-size="11" text-anchor="middle">1: Escanea código barras (EAN-13)</text>

    <line x1="495" y1="170" x2="840" y2="170" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="660" y="162" fill="#e2e8f0" font-size="11" text-anchor="middle">2: buscarProductoPorCodigo(codigo) [&lt;10ms]</text>

    <line x1="840" y1="200" x2="495" y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#seq-dash-arrow)"/>
    <text x="660" y="192" fill="#94a3b8" font-size="11" text-anchor="middle">3: retorna datosProducto (precio, stock ABC)</text>

    <line x1="495" y1="230" x2="170" y2="230" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#seq-dash-arrow)"/>
    <text x="320" y="222" fill="#94a3b8" font-size="11" text-anchor="middle">4: renderiza renglón y actualiza total ticket</text>

    <line x1="170" y1="270" x2="495" y2="270" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="320" y="262" fill="#e2e8f0" font-size="11" text-anchor="middle">5: Presiona F10 (Cobro) e ingresa Efectivo</text>

    <line x1="495" y1="310" x2="1190" y2="310" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="840" y="302" fill="#e2e8f0" font-size="11" text-anchor="middle">6: registrarTransaccionCompleta(venta, detalles, turnoId)</text>

    <!-- Activation box on BD -->
    <rect x="1182" y="320" width="16" height="100" fill="#334155" stroke="#38bdf8" stroke-width="1"/>
    <text x="1210" y="340" fill="#a7f3d0" font-size="11">INSERT INTO ventas (...)</text>
    <text x="1210" y="360" fill="#a7f3d0" font-size="11">INSERT INTO detalle_ventas (...)</text>
    <text x="1210" y="380" fill="#a7f3d0" font-size="11">INSERT INTO kardex_movimientos (SALIDA_VENTA)</text>
    <text x="1210" y="400" fill="#a7f3d0" font-size="11">UPDATE productos SET stock_actual = stock - n</text>

    <line x1="1182" y1="425" x2="495" y2="425" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#seq-dash-arrow)"/>
    <text x="840" y="418" fill="#94a3b8" font-size="11" text-anchor="middle">7: confirmación éxito Venta (id_venta, folio)</text>

    <line x1="495" y1="465" x2="1485" y2="465" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="990" y="457" fill="#e2e8f0" font-size="11" text-anchor="middle">8: window.print() / comprobante con membrete "Papelería A B C"</text>

    <line x1="1485" y1="495" x2="170" y2="495" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#seq-dash-arrow)"/>
    <text x="800" y="488" fill="#94a3b8" font-size="11" text-anchor="middle">9: Ticket físico entregado al cliente</text>
  </g>

  <!-- ================= SECTION 2: DESGLOSE EMPAQUE A PIEZA ================= -->
  <g transform="translate(40, 730)">
    <rect width="1620" height="570" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="15" width="480" height="32" rx="6" fill="#4338ca"/>
    <text x="35" y="37" fill="#ffffff" font-size="14" font-weight="bold">Secuencia 2: Conversión y Desglose Caja a Pieza (Papelería A B C - RF-05)</text>

    <!-- Lifelines -->
    <!-- 1. Almacenista -->
    <rect x="120" y="70" width="150" height="36" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="195" y="93" fill="#818cf8" font-size="13" font-weight="bold" text-anchor="middle">:Almacenista ABC</text>
    <line x1="195" y1="106" x2="195" y2="520" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- 2. UI Modulo Almacen -->
    <rect x="470" y="70" width="160" height="36" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="550" y="93" fill="#818cf8" font-size="13" font-weight="bold" text-anchor="middle">:ModuloInventarioUI</text>
    <line x1="550" y1="106" x2="550" y2="520" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- 3. Controlador Conversiones -->
    <rect x="850" y="70" width="180" height="36" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="940" y="93" fill="#818cf8" font-size="13" font-weight="bold" text-anchor="middle">:ConversionesService</text>
    <line x1="940" y1="106" x2="940" y2="520" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- 4. Base de Datos / Kardex -->
    <rect x="1250" y="70" width="180" height="36" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="1340" y="93" fill="#818cf8" font-size="13" font-weight="bold" text-anchor="middle">:PersistenciaKardex</text>
    <line x1="1340" y1="106" x2="1340" y2="520" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Messages -->
    <line x1="195" y1="140" x2="550" y2="140" stroke="#818cf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="370" y="132" fill="#e2e8f0" font-size="11" text-anchor="middle">1: Selecciona "Caja Bolígrafos Bic x 12" y solicita desglose</text>

    <line x1="550" y1="175" x2="940" y2="175" stroke="#818cf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="740" y="167" fill="#e2e8f0" font-size="11" text-anchor="middle">2: consultarReglaConversion(id_producto_empaque)</text>

    <line x1="940" y1="210" x2="1340" y2="210" stroke="#818cf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="1140" y="202" fill="#e2e8f0" font-size="11" text-anchor="middle">3: SELECT * FROM conversiones_empaque WHERE id_empaque = ?</text>

    <line x1="1340" y1="240" x2="940" y2="240" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#seq-dash-arrow)"/>
    <text x="1140" y="232" fill="#94a3b8" font-size="11" text-anchor="middle">4: retorna regla (id_pieza=1, ratio=12)</text>

    <line x1="940" y1="275" x2="550" y2="275" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#seq-dash-arrow)"/>
    <text x="740" y="267" fill="#94a3b8" font-size="11" text-anchor="middle">5: muestra modal: Desglosar 1 caja generará 12 piezas sueltas</text>

    <line x1="195" y1="315" x2="550" y2="315" stroke="#818cf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="370" y="307" fill="#e2e8f0" font-size="11" text-anchor="middle">6: Confirma ejecución de desglose (cantidad: 1 caja)</text>

    <line x1="550" y1="355" x2="940" y2="355" stroke="#818cf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <text x="740" y="347" fill="#e2e8f0" font-size="11" text-anchor="middle">7: ejecutarTransaccionDesglose(empaqueId, 1)</text>

    <!-- Activation box in Kardex -->
    <rect x="1332" y="365" width="16" height="110" fill="#334155" stroke="#818cf8" stroke-width="1"/>
    <text x="1050" y="390" fill="#fbcfe8" font-size="11">BEGIN TRANSACTION</text>
    <text x="1050" y="410" fill="#fbcfe8" font-size="11">UPDATE productos SET stock = stock - 1 WHERE id = empaque</text>
    <text x="1050" y="430" fill="#fbcfe8" font-size="11">UPDATE productos SET stock = stock + 12 WHERE id = pieza</text>
    <text x="1050" y="450" fill="#fbcfe8" font-size="11">INSERT INTO kardex (DESGLOSE_SALIDA &amp; DESGLOSE_ENTRADA)</text>
    <text x="1050" y="470" fill="#fbcfe8" font-size="11">COMMIT TRANSACTION</text>

    <line x1="1332" y1="485" x2="550" y2="485" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#seq-dash-arrow)"/>
    <text x="940" y="478" fill="#94a3b8" font-size="11" text-anchor="middle">8: Transacción ACID confirmada exitosamente</text>

    <line x1="550" y1="515" x2="195" y2="515" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#seq-dash-arrow)"/>
    <text x="370" y="508" fill="#94a3b8" font-size="11" text-anchor="middle">9: Notificación visual: Stock de piezas actualizado (+12)</text>
  </g>

</svg>