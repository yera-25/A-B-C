<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #152c4a; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #64748b; }
      .node-box { rx: 8px; stroke-width: 2px; }
      .node-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .node-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; }
      .arrow { stroke: #0284c7; stroke-width: 2.5px; fill: none; marker-end: url(#arrowhead); }
      .arrow-alt { stroke: #3a8e63; stroke-width: 2.5px; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead-green); }
      .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: 800; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a8e63" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" fill="#f8fafc" />

  <!-- Header -->
  <rect x="40" y="30" width="1020" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)" />
  <text x="65" y="65" class="title">FLUJO TRANSACCIONAL DEL PUNTO DE VENTA (POS)</text>
  <text x="65" y="85" class="subtitle">Papelería A B C — Fase 5: Sprint 2 (Módulo de Ventas Operativo | Sem 5: 26-29 Oct 2026)</text>

  <!-- Row 1: Entrada y Selección -->
  <!-- Node 1: Atajo F1 / Escaneo -->
  <g transform="translate(60, 140)" filter="url(#shadow)">
    <rect width="210" height="90" class="node-box" fill="#ffffff" stroke="#152c4a" />
    <rect width="210" height="26" rx="8" fill="#152c4a" />
    <text x="15" y="18" fill="#ffffff" class="badge">1. CAPTURA EN MOSTRADOR</text>
    <text x="15" y="48" class="node-title" fill="#152c4a">Lector Láser / Búsqueda [F1]</text>
    <text x="15" y="66" class="node-desc">Escaneo EAN-13 (&lt;5ms)</text>
    <text x="15" y="80" class="node-desc">Búsqueda predictiva in-memory</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="270" y1="185" x2="310" y2="185" class="arrow" />

  <!-- Node 2: Multicarrito 1 a 5 -->
  <g transform="translate(320, 140)" filter="url(#shadow)">
    <rect width="210" height="90" class="node-box" fill="#ffffff" stroke="#0284c7" />
    <rect width="210" height="26" rx="8" fill="#0284c7" />
    <text x="15" y="18" fill="#ffffff" class="badge">2. GESTIÓN MULTI-CARRITO</text>
    <text x="15" y="48" class="node-title" fill="#0284c7">Carritos 1 a 5 [F2]</text>
    <text x="15" y="66" class="node-desc">Ventas simultáneas en espera</text>
    <text x="15" y="80" class="node-desc">Validación de stock disponible</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="530" y1="185" x2="570" y2="185" class="arrow" />

  <!-- Node 3: Precios Diferenciados -->
  <g transform="translate(580, 140)" filter="url(#shadow)">
    <rect width="210" height="90" class="node-box" fill="#ffffff" stroke="#b45309" />
    <rect width="210" height="26" rx="8" fill="#b45309" />
    <text x="15" y="18" fill="#ffffff" class="badge">3. POLÍTICA DE PRECIOS</text>
    <text x="15" y="48" class="node-title" fill="#b45309">Menudeo vs Mayoreo</text>
    <text x="15" y="66" class="node-desc">Volumen automático (cant ≥ 5)</text>
    <text x="15" y="80" class="node-desc">Toggle manual en renglón</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="790" y1="185" x2="830" y2="185" class="arrow" />

  <!-- Node 4: Servicios Rápidos -->
  <g transform="translate(840, 140)" filter="url(#shadow)">
    <rect width="200" height="90" class="node-box" fill="#ffffff" stroke="#3a8e63" />
    <rect width="200" height="26" rx="8" fill="#3a8e63" />
    <text x="15" y="18" fill="#ffffff" class="badge">4. SERVICIOS EXPRÉS [F4]</text>
    <text x="15" y="48" class="node-title" fill="#3a8e63">Copias e Impresiones</text>
    <text x="15" y="66" class="node-desc">B/N ($1), Color ($5)</text>
    <text x="15" y="80" class="node-desc">Enmicados carta ($15)</text>
  </g>

  <!-- Vertical connector down -->
  <path d="M 940 230 L 940 290 L 940 310" class="arrow" />

  <!-- Row 2: Descuento, Cobro y Totales -->
  <!-- Node 5: Descuentos Especiales -->
  <g transform="translate(840, 320)" filter="url(#shadow)">
    <rect width="200" height="95" class="node-box" fill="#ffffff" stroke="#d9534f" />
    <rect width="200" height="26" rx="8" fill="#d9534f" />
    <text x="15" y="18" fill="#ffffff" class="badge">5. DESCUENTO COMERCIAL</text>
    <text x="15" y="48" class="node-title" fill="#d9534f">Promociones y Descuentos</text>
    <text x="15" y="66" class="node-desc">Botones rápidos: 0, 5, 10, 15%</text>
    <text x="15" y="80" class="node-desc">Recálculo automático de IVA (16%)</text>
  </g>

  <!-- Arrow 5 to 6 -->
  <line x1="840" y1="367" x2="800" y2="367" class="arrow" />

  <!-- Node 6: Cobro y Formas de Pago [F10] -->
  <g transform="translate(560, 320)" filter="url(#shadow)">
    <rect width="230" height="95" class="node-box" fill="#ffffff" stroke="#152c4a" />
    <rect width="230" height="26" rx="8" fill="#152c4a" />
    <text x="15" y="18" fill="#ffffff" class="badge">6. PASARELA EN MOSTRADOR [F10]</text>
    <text x="15" y="48" class="node-title" fill="#152c4a">Cobro &amp; Denominación Rápida</text>
    <text x="15" y="66" class="node-desc">Billetes: $50, $100, $200, $500, Exacto</text>
    <text x="15" y="80" class="node-desc">Efectivo, Tarjeta Débito/Crédito, SPEI</text>
  </g>

  <!-- Arrow 6 to 7 -->
  <line x1="560" y1="367" x2="520" y2="367" class="arrow" />

  <!-- Node 7: Calculadora de Cambio -->
  <g transform="translate(290, 320)" filter="url(#shadow)">
    <rect width="220" height="95" class="node-box" fill="#ffffff" stroke="#3a8e63" />
    <rect width="220" height="26" rx="8" fill="#3a8e63" />
    <text x="15" y="18" fill="#ffffff" class="badge">7. CUADRATURA DE EFECTIVO</text>
    <text x="15" y="48" class="node-title" fill="#3a8e63">Cálculo de Cambio</text>
    <text x="15" y="66" class="node-desc">Diferencia instantánea en verde</text>
    <text x="15" y="80" class="node-desc">Bloqueo ante faltante de pago</text>
  </g>

  <!-- Arrow 7 to 8 -->
  <line x1="290" y1="367" x2="250" y2="367" class="arrow" />

  <!-- Node 8: Transacción Atómica SQL -->
  <g transform="translate(50, 320)" filter="url(#shadow)">
    <rect width="190" height="95" class="node-box" fill="#ffffff" stroke="#1e293b" />
    <rect width="190" height="26" rx="8" fill="#1e293b" />
    <text x="15" y="18" fill="#ffffff" class="badge">8. PERSISTENCIA ATÓMICA</text>
    <text x="15" y="48" class="node-title" fill="#1e293b">Asiento SQLite &amp; Kardex</text>
    <text x="15" y="66" class="node-desc">Generación Folio TICK-XXXXX</text>
    <text x="15" y="80" class="node-desc">Decremento de stock en 3FN</text>
  </g>

  <!-- Vertical connector down -->
  <path d="M 145 415 L 145 470 L 145 490" class="arrow" />

  <!-- Row 3: Salida, Tickets y Auditoría -->
  <!-- Node 9: Emisión Ticket Térmico -->
  <g transform="translate(50, 500)" filter="url(#shadow)">
    <rect width="270" height="110" class="node-box" fill="#ffffff" stroke="#0284c7" />
    <rect width="270" height="26" rx="8" fill="#0284c7" />
    <text x="15" y="18" fill="#ffffff" class="badge">9. EMISIÓN DE COMPROBANTE (RF-04)</text>
    <text x="15" y="48" class="node-title" fill="#0284c7">Ticket Térmico (58mm / 80mm)</text>
    <text x="15" y="66" class="node-desc">Logotipo oficial y datos fiscales de Papelería A B C</text>
    <text x="15" y="80" class="node-desc">Desglose de artículos, IVA y cambio</text>
    <text x="15" y="94" class="node-desc">Código de barras del ticket e impresión directa</text>
  </g>

  <!-- Arrow 9 to 10 -->
  <line x1="320" y1="555" x2="380" y2="555" class="arrow" />

  <!-- Node 10: Acumulación en Turno de Caja -->
  <g transform="translate(390, 500)" filter="url(#shadow)">
    <rect width="290" height="110" class="node-box" fill="#ffffff" stroke="#152c4a" />
    <rect width="290" height="26" rx="8" fill="#152c4a" />
    <text x="15" y="18" fill="#ffffff" class="badge">10. INTEGRACIÓN A CAJA Y AUDITORÍA</text>
    <text x="15" y="48" class="node-title" fill="#152c4a">Acumulador en Turno Activo</text>
    <text x="15" y="66" class="node-desc">Suma en efectivo, tarjeta o SPEI</text>
    <text x="15" y="80" class="node-desc">Actualización en vivo de esperado en cajón</text>
    <text x="15" y="94" class="node-desc">Auditoría lista para el Corte Z de jornada</text>
  </g>

  <!-- Arrow 10 to 11 -->
  <line x1="680" y1="555" x2="740" y2="555" class="arrow" />

  <!-- Node 11: Historial y Reimpresión [F8] -->
  <g transform="translate(750, 500)" filter="url(#shadow)">
    <rect width="290" height="110" class="node-box" fill="#ffffff" stroke="#3a8e63" />
    <rect width="290" height="26" rx="8" fill="#3a8e63" />
    <text x="15" y="18" fill="#ffffff" class="badge">11. CONSULTA POST-VENTA [F8]</text>
    <text x="15" y="48" class="node-title" fill="#3a8e63">Historial de Tickets Emitidos</text>
    <text x="15" y="66" class="node-desc">Visualización de ventas de la jornada</text>
    <text x="15" y="80" class="node-desc">Botón de reimpresión térmica en un clic</text>
    <text x="15" y="94" class="node-desc">Trazabilidad para devoluciones o garantías</text>
  </g>

  <!-- Footer note -->
  <text x="50" y="660" class="node-desc" fill="#64748b">Nota: Cada transacción descuenta inventario en tiempo real con latencia &lt;5ms mediante In-Memory SQL Engine.</text>
</svg>